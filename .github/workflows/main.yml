name: Render document
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: ^0.15.0
      - uses: actions/configure-pages@v5
      - run: typst compile resume.typ resume.pdf
      - name: Publish PDF release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="resume-${GITHUB_SHA::7}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" resume.pdf \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Resume ${GITHUB_SHA::7}" \
              --notes "Automatically built from commit ${GITHUB_SHA}." \
              --latest
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    runs-on: ubuntu-latest
    needs: render
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/deploy-pages@v4
